name: Security scan

# Runs independently of the main CI pipeline so newly disclosed CVEs in
# already-pinned dependencies get caught even when nobody touches the
# code that week — not just at push/PR time.
on:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["backend/requirements*.txt"]

defaults:
  run:
    working-directory: backend

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Static security analysis (bandit)
        run: bandit -r . -x './.venv,./htmlcov,*/tests/*,*/migrations/*' -f json -o bandit-report.json

      - name: Dependency vulnerability scan (pip-audit)
        run: pip-audit -r requirements.txt -f json -o pip-audit-report.json

      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-reports
          path: |
            backend/bandit-report.json
            backend/pip-audit-report.json
